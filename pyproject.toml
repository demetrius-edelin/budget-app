[project]
name = "spendtrack"
version = "0.1.0"
description = "Single-user expense tracker that runs on a laptop."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "anthropic>=1.9.0",
    "openai>=3.20.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spendtrack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"spendtrack/core/ai_parse.py" = ["E501"]  # the prompt text keeps its natural line length

[tool.pytest.ini_options]
testpaths = ["tests"]
