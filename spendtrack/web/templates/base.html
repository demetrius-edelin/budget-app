<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spendtrack{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
{% set path = request.url.path %}
<header class="topbar">
  <a class="brand" href="/">Spendtrack</a>
  <nav>
    <a href="/add" class="nav-add {{ 'active' if path.startswith('/add') }}" title="Adaugă" aria-label="Adaugă">+</a>
    <a href="/" class="{{ 'active' if path == '/' }}">Panou</a>
    <a href="/expenses" class="{{ 'active' if path.startswith('/expenses') }}">Cheltuieli</a>
    <a href="/review" class="{{ 'active' if path.startswith('/review') }}">Evaluare{% with oob=false %}{% include "partials/review_badge.html" %}{% endwith %}</a>
    <a href="/reports" class="{{ 'active' if path.startswith('/reports') }}">Rapoarte</a>
    <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Setări</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
