<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spendtrack{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
{% set path = request.url.path %}
<header class="topbar">
  <a class="brand" href="/">Spendtrack</a>
  <nav>
    <a href="/" class="{{ 'active' if path == '/' }}">Overview</a>
    <a href="/add" class="{{ 'active' if path.startswith('/add') }}">Add</a>
    <a href="/expenses" class="{{ 'active' if path.startswith('/expenses') }}">Expenses</a>
    <a href="/review" class="{{ 'active' if path.startswith('/review') }}">Review{% if unrated %} <span class="badge">{{ unrated }}</span>{% endif %}</a>
    <a href="/reports" class="{{ 'active' if path.startswith('/reports') }}">Reports</a>
    <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Settings</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
